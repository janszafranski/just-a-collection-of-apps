name: Build Windows executables

# Builds the real, native Windows .exe for all four "just a..." apps.
# This MUST run on a Windows runner — PyInstaller produces a native executable
# and cannot cross-compile from Linux. This workflow is what actually produces
# the downloadable "Windows versions": run it manually, or push a v* tag to
# also publish the .exe files on a GitHub Release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create/attach a Release on tag pushes

jobs:
  build:
    name: Build .exe on Windows
    runs-on: windows-latest

    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          # the apps' fonts\ folders are symlinks into pagecreator\fonts;
          # let git materialise them so PyInstaller can bundle the fonts.
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build + app dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # PyInstaller (the packager) + Pillow (used to make the .ico icons).
          python -m pip install pyinstaller Pillow
          # The union of every app's dependencies, matching each install.sh:
          #   paint        -> PySide6 Pillow numpy  (+ optional opencv, below)
          #   draw         -> PySide6
          #   pagecreator  -> PySide6 beautifulsoup4
          #   webcreator   -> PySide6 beautifulsoup4
          python -m pip install PySide6 numpy beautifulsoup4
          # OpenCV is OPTIONAL (paint's Smart Mask); never fail the build for it.
          python -m pip install opencv-python-headless; if (-not $?) { Write-Host "opencv optional - skipping" }
          exit 0

      - name: Build all four executables
        shell: pwsh
        run: pwsh -File tools/build-windows-exe.ps1 -App all

      - name: List built artifacts
        shell: pwsh
        run: Get-ChildItem dist

      - name: Upload the .exe files as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: just-a-apps-windows-exe
          path: dist/*.exe
          if-no-files-found: error

      # On a v* tag, also publish the .exe files on a GitHub Release so end
      # users can download them without installing Python.
      - name: Attach the .exe files to a Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
